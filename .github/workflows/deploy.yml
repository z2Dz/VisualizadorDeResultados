name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish "VisualizadorDeResultadosBolão/VisualizadorDeResultadosBolão.csproj" -c Release -o release

      - name: Update base href
        run: sed -i 's|<base href="/" />|<base href="/VisualizadorDeResultados/" />|g' release/wwwroot/index.html

      - name: SPA fallback
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
